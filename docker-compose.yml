version: "3.9"

services:
  bio-agent-os:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8055:8055"
    env_file:
      - .env
    environment:
      AGENT_NAME: ${AGENT_NAME:-Bio-AI}
      STORAGE_DIR: ${STORAGE_DIR:-/app/data}
      BIO_AGENT_DB_BACKEND: ${BIO_AGENT_DB_BACKEND:-sqlite}
      BIO_AGENT_DATABASE_URL: ${BIO_AGENT_DATABASE_URL:-}
      BIO_AGENT_API_KEY: ${BIO_AGENT_API_KEY:-}
      BIO_AGENT_TENANT_KEYS: ${BIO_AGENT_TENANT_KEYS:-}
      BIO_AGENT_SECRET_KEY: ${BIO_AGENT_SECRET_KEY:-}
      BIO_AGENT_RATE_LIMIT: ${BIO_AGENT_RATE_LIMIT:-120}
      BIO_AGENT_CORS_ORIGINS: ${BIO_AGENT_CORS_ORIGINS:-}
    volumes:
      - ./data:/app/data
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bio_agent_os}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

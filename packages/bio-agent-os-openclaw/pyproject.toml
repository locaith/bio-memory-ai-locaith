[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bio-locaith-openclaw"
version = "0.6.1"
description = "OpenClaw sidecar packaging helpers for Bio-Agent OS under the Locaith brand."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Locaith Solution Tech", email = "contact@locaith.com"},
]
dependencies = [
    "bio-agent-os>=0.6.1",
]

[project.scripts]
bio-locaith-openclaw = "bio_agent_os_openclaw.cli:main"
bio-agent-os-openclaw = "bio_agent_os_openclaw.cli:main"

[tool.setuptools.package-data]
bio_agent_os_openclaw = ["assets/*"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["bio_agent_os_openclaw*"]

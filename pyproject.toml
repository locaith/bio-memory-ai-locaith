[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bio-agent-os"
version = "0.4.0"
description = "Open-source bio-inspired memory framework for AI agents."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Locaith Solution Tech", email = "contact@locaith.com"},
]
keywords = ["ai", "memory", "bio-inspired", "agent", "llm", "knowledge-graph"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "qdrant-client>=1.6.0",
    "cryptography>=41.0.0"
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0.0"]
ollama = ["aiohttp>=3.9.0"]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.39.0"]
all = [
    "google-genai>=1.0.0",
    "aiohttp>=3.9.0",
    "openai>=1.0.0",
    "anthropic>=0.39.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.urls]
Homepage = "https://github.com/locaith/bio-memory-ai-locaith"
Documentation = "https://github.com/locaith/bio-memory-ai-locaith#readme"
Repository = "https://github.com/locaith/bio-memory-ai-locaith"
Issues = "https://github.com/locaith/bio-memory-ai-locaith/issues"

[tool.setuptools.packages.find]
include = ["bio_agent_os*"]

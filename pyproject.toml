[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bio-agent-os"
version = "0.8.1a1"
description = "Open-source bio-inspired memory framework for AI agents."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Locaith Solution Tech", email = "contact@locaith.com"},
]
keywords = ["ai", "memory", "bio-inspired", "agent", "llm", "knowledge-graph"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "qdrant-client>=1.6.0",
    "cryptography>=41.0.0"
]

[project.scripts]
bio-agent-os = "bio_agent_os.cli:main"
bio-agi-memory = "bio_agent_os.cognitive.cli:main"
bio-memory-hook = "bio_agent_os.cognitive.hook_cli:main"

[project.entry-points."bio_agent_os.plugins"]
openclaw = "bio_agent_os.plugins.openclaw:build_openclaw_plugin"
swe-agent = "bio_agent_os.plugins.swe_agent:build_swe_agent_plugin"

[project.optional-dependencies]
mcp = ["mcp>=1.2.0"]
gemini = ["google-genai>=1.0.0"]
ollama = ["aiohttp>=3.9.0"]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.39.0"]
embeddings = ["sentence-transformers>=3.0.0"]
async-sqlite = ["aiosqlite>=0.20.0"]
postgres = ["psycopg[binary]>=3.2.0"]
client = ["httpx>=0.28.0"]
all = [
    "mcp>=1.2.0",
    "google-genai>=1.0.0",
    "aiohttp>=3.9.0",
    "openai>=1.0.0",
    "anthropic>=0.39.0",
    "sentence-transformers>=3.0.0",
    "aiosqlite>=0.20.0",
    "psycopg[binary]>=3.2.0",
    "httpx>=0.28.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.urls]
Homepage = "https://github.com/locaith/bio-memory-ai-locaith"
Documentation = "https://github.com/locaith/bio-memory-ai-locaith#readme"
Repository = "https://github.com/locaith/bio-memory-ai-locaith"
Issues = "https://github.com/locaith/bio-memory-ai-locaith/issues"

[tool.setuptools.packages.find]
include = ["bio_agent_os*"]

[tool.pytest.ini_options]
# A load test in the unit suite makes the unit suite something people stop
# running. Both markers are deselected by default and opted into explicitly:
#   pytest -m benchmark        multi-process load, seconds to minutes
#   pytest -m soak             long-running; measured in hours
addopts = "-m 'not benchmark and not soak'"
markers = [
    "benchmark: multi-process reliability load; excluded from the default run",
    "soak: long-running reliability load; excluded from the default run",
]
